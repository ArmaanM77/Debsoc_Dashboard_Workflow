name: Install account linking safeguards
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: member-profile-schema
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test constraints against isolated PostgreSQL (no live credentials)
        env:
          RUN_POSTGRES_TESTS: '1'
        run: python -m unittest discover -s tests -p 'test_account_link_database.py'
  backup:
    needs: verify
    uses: ./.github/workflows/backup-supabase.yml
    secrets: inherit
  install:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply identity constraints transactionally
        env:
          DEST_DB_URL: ${{ secrets.DEST_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace:ro" postgres:17 \
            psql "$DEST_DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
            --file=/workspace/migrations/20261024_account_link_safety.sql
