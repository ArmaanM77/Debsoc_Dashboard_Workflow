name: Publish member appearance feed
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'migrations/20261026_member_appearances.sql'
      - 'tests/test_account_link_database.py'
      - '.github/workflows/member-appearances.yml'
permissions:
  contents: read
concurrency:
  group: member-appearances-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test appearance projection in isolated PostgreSQL (no live credentials)
        env:
          RUN_POSTGRES_TESTS: '1'
        run: python -m unittest discover -s tests -p 'test_account_link_database.py'
  backup:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    uses: ./.github/workflows/backup-supabase.yml
    secrets: inherit
  install:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only appearance projection transactionally
        env:
          DEST_DB_URL: ${{ secrets.DEST_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace:ro" postgres:17 \
            psql "$DEST_DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
            --file=/workspace/migrations/20261026_member_appearances.sql
      - name: Verify read-only permissions and private table protection
        env:
          DEST_DB_URL: ${{ secrets.DEST_DB_URL }}
        run: |
          docker run --rm postgres:17 psql "$DEST_DB_URL" -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF has_table_privilege('anon','public.dk_profiles','SELECT') OR NOT has_function_privilege('anon','public.dk_member_appearances()','EXECUTE') THEN RAISE EXCEPTION 'Unsafe appearance feed permissions'; END IF; END \$\$;"
